name: Dispatch initial Milan setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch_initial_setup.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'trigger initial Milan setup')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical setup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run setup.yml --repo "${GITHUB_REPOSITORY}" --ref main
